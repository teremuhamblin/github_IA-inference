name: ✨ Feature Request
description: Proposer une nouvelle fonctionnalité IA
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      placeholder: Quel problème cette fonctionnalité résout-elle ?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      placeholder: Décris la fonctionnalité souhaitée
