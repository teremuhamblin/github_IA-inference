name: IA Docs for .githubSecrets

on:
  workflow_dispatch:

jobs:
  ai-doc:
    runs-on: ubuntu-latest
    steps:
      - name: AI documentation
        uses: teremuhamblin/github_IA-inference/.github/actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/secrets-doc.prompt.yml
          system-file: .github/prompts/system.txt
          task-type: doc
          output-path: artifacts/secrets-doc.md
