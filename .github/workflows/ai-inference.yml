name: 🤖 AI Inference

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Copilot CLI
        uses: github/copilot-cli-action@v1

      - name: Run AI inference
        run: |
          copilot exec \
            --model gpt-4.1 \
            --prompt-file .github/prompts/sample.prompt.yml \
            --system-file .github/prompts/system.txt \
            --output artifacts/diff.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-output
          path: artifacts/diff.txt
