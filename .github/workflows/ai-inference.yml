name: Reusable AI Inference

on:
  workflow_call:
    inputs:
      model:
        required: false
        type: string
        default: gpt-4.1
      prompt-file:
        required: true
        type: string
      system-file:
        required: false
        type: string
        default: .github/prompts/system.txt
      output-path:
        required: false
        type: string
        default: artifacts/diff.txt
      task-type:
        required: false
        type: string
        default: generic

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - name: AI inference
        uses: teremuhamblin/github_IA-inference/.github/actions/ai-inference@v1
        with:
          model: ${{ inputs.model }}
          prompt-file: ${{ inputs.prompt-file }}
          system-file: ${{ inputs.system-file }}
          output-path: ${{ inputs.output-path }}
          task-type: ${{ inputs.task-type }}
